services:
  - type: web
    name: catastrofe-logistica-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SAME_SITE
        value: none
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_EXPIRES_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: DATABASE_URL
        fromDatabase:
          name: catastrofe-logistica-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: catastrofe-logistica-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: APP_PUBLIC_URL
        sync: false

  - type: web
    name: catastrofe-logistica-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: catastrofe-logistica-db
    databaseName: catastrofe_logistica
    user: catastrofe_logistica
    region: oregon
    plan: free
