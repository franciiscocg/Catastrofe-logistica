services:
  - type: web
    name: catastrofe-logistica
    runtime: node
    plan: free
    buildCommand: npm --prefix backend ci --include=dev && npm --prefix frontend ci --include=dev && npm --prefix frontend run build && npm --prefix backend run build
    startCommand: cd backend && npm run start:render
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SAME_SITE
        value: lax
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_EXPIRES_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: DATABASE_URL
        fromDatabase:
          name: catastrofe-logistica-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: catastrofe-logistica-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: APP_PUBLIC_URL
        sync: false

databases:
  - name: catastrofe-logistica-db
    databaseName: catastrofe_logistica
    user: catastrofe_logistica
    region: oregon
    plan: free
