name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancela ejecuciones previas de la misma rama/PR si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-check:
    name: Migraciones desde una base vacía
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: catlogistica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catlogistica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catlogistica_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/catlogistica_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias backend
        working-directory: backend
        run: npm ci

      - name: Aplicar historial completo de migraciones
        working-directory: backend
        run: npm run db:migrate:deploy

      - name: Verificar que el esquema está sincronizado
        working-directory: backend
        run: npx prisma migrate status

  unit-tests:
    name: Tests unitarios (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Los tests de backend mockean Prisma (no necesitan BD ni Redis). El test
      # de realtime importa socket.io-client desde frontend/node_modules, por eso
      # instalamos las dependencias de ambos paquetes en el mismo job.
      - name: Instalar dependencias backend
        working-directory: backend
        run: npm ci

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      # Genera el cliente de Prisma (solo necesita el schema, no una BD viva).
      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Tests backend
        working-directory: backend
        run: npm test

      - name: Tests frontend
        working-directory: frontend
        run: npm test

      # Banco de pruebas del enrutamiento (heurística vs grafo). Actúa como test
      # de regresión del algoritmo y valida los invariantes de la evaluación.
      - name: Benchmark de enrutamiento (regresión)
        working-directory: frontend
        run: npm run bench

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Auditar dependencias de producción
        run: |
          npm audit --omit=dev --prefix backend
          npm audit --omit=dev --prefix frontend

      - name: Instalar Chromium para smoke E2E
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E de búsqueda y navegación
        working-directory: frontend
        run: npm run test:e2e:smoke

# Nota: la suite E2E completa (Playwright) necesita el stack completo levantado
# (frontend en :5173 + backend + BD) y no encaja en este job de unitarios. El
# smoke E2E usa respuestas API deterministas y levanta Vite automáticamente. La
# suite E2E completa sigue disponible con `npm run test:e2e` contra el stack.
